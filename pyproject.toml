[project]
name = "tiny-event-bus"
version = "0.3.0"
description = "Zero-dependency in-process pub/sub event bus for Python. Topics, wildcards, DLQ, replay, retries, async."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-event-bus"
Repository = "https://github.com/hussain-alsaibai/tiny-event-bus"
Issues = "https://github.com/hussain-alsaibai/tiny-event-bus/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tiny_event_bus"]
